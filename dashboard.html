<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NordVPN - My Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom shadow-sm">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold tracking-wide" href="index.html">NORDVPN <span class="fw-light text-secondary">| Client</span></a>
                <div class="d-flex align-items-center">
                    <span class="text-light me-4">Status: <span class="badge bg-danger" id="connectionStatus">Disconnected</span></span>
                    <a class="btn btn-sm btn-outline-light" href="index.html">Log Out</a>
                </div>
            </div>
        </nav>
    </header>

    <div class="container-fluid">
        <div class="row">
            
            <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar border-end" style="min-height: 90vh;">
                <div class="position-sticky pt-4 px-3">
                    <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mb-3 text-muted text-uppercase fw-bold">
                        <span>My Network</span>
                    </h6>
                    <ul class="nav flex-column mb-4">
                        <li class="nav-item mb-2">
                            <a class="nav-link active fw-bold text-dark bg-light rounded" href="#">
                                🌍 Global Map
                            </a>
                        </li>
                    </ul>

                    <div id="proSidebarMenu" class="d-none">
                        <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mb-3 text-primary text-uppercase fw-bold mt-4">
                            <span>Pro Features</span>
                        </h6>
                        <ul class="nav flex-column mb-4">
                            <li class="nav-item">
                                <a class="nav-link text-secondary" href="#">
                                    🔒 Dedicated IP Setup
                                </a>
                            </li>
                        </ul>
                    </div>

                    <div id="businessSidebarMenu" class="d-none">
                        <h6 class="sidebar-heading d-flex justify-content-between align-items-center px-3 mb-3 text-dark text-uppercase fw-bold mt-4">
                            <span>Enterprise Admin</span>
                        </h6>
                        <ul class="nav flex-column">
                            <li class="nav-item mb-2">
                                <a class="nav-link text-secondary" href="#">
                                    👥 Manage Team
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-secondary" href="#">
                                    📊 Network Logs
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-5 py-4">
                
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                    <h1 class="h2 fw-bold">Welcome, <span id="userTierDisplay" class="text-primary">Standard</span> User</h1>
                    <button class="btn btn-success fw-bold px-4" id="connectBtn">Connect VPN</button>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white fw-bold py-3">Global Server Network</div>
                    <div class="card-body bg-light p-0 position-relative" id="mapContainer" style="height: 450px; overflow: hidden; background-color: #1a1a1a;">
                        
                        <img src="images/InteractiveMap.jpg" alt="Interactive World Map" style="width:
